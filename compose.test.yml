# Postgres per i test di concorrenza [C]: `npm run test:concurrency` lo avvia da sé.
# Spegnerlo: docker compose -f compose.test.yml down
#
# Stessa major di PGlite (18). I dati stanno in tmpfs e la durabilità è spenta:
# ogni file di test crea e cancella il proprio database, quindi non c'è nulla da conservare.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: clash
      POSTGRES_PASSWORD: clash
      POSTGRES_DB: clash_test
    ports:
      - '54329:5432'
    tmpfs:
      - /var/lib/postgresql
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clash -d clash_test']
      interval: 1s
      timeout: 3s
      retries: 30
